<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>arTwitteriv</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">arTwitteriv</div>
      <div class="subtitle" data-i18n="feedSubtitle">A timeline where papers simply flow by.</div>
    </div>
    <div class="header-actions">
      <button id="refreshButton" class="secondary" data-i18n="refresh">Refresh</button>
      <button id="optionsButton" class="secondary" data-i18n="settings">Settings</button>
    </div>
  </header>

  <main>
    <nav class="feed-tabs" aria-label="Timeline views" data-i18n-aria-label="feedTabsLabel">
      <button data-mode="latest" class="tab active" data-i18n="tabLatest">Latest</button>
      <button data-mode="search" class="tab" data-i18n="tabSearch">Search</button>
      <button data-mode="random" class="tab" data-i18n="tabRandom">Random</button>
      <button data-mode="classics" class="tab" data-i18n="tabClassics">Classics</button>
      <button data-mode="saved" class="tab" data-i18n="tabSaved">Saved</button>
    </nav>

    <section id="feedControls" class="feed-controls">
      <label id="fieldControl">
        <span data-i18n="field">Field</span>
        <select id="fieldSelect"></select>
      </label>
      <form id="searchForm" class="search-control" hidden>
        <label>
          <span data-i18n="searchLabel">Search arXiv</span>
          <input id="searchInput" type="search" placeholder="generalized symmetry" data-i18n-placeholder="searchPlaceholder">
        </label>
        <button id="searchButton" class="primary compact" type="submit" data-i18n="searchSubmit">Search</button>
      </form>
      <form id="classicsSearchForm" class="search-control" hidden>
        <label>
          <span data-i18n="classicsSearchLabel">Filter classics</span>
          <input id="classicsSearchInput" type="search" placeholder="duality" data-i18n-placeholder="classicsSearchPlaceholder">
        </label>
        <button id="classicsSearchButton" class="primary compact" type="submit" data-i18n="searchSubmit">Search</button>
      </form>
      <div id="serendipityControl" class="segmented-control" hidden>
        <span class="control-label" data-i18n="serendipityLabel">Serendipity</span>
        <div id="serendipityButtons" class="segment-buttons" role="group" aria-label="Serendipity dial" data-i18n-aria-label="serendipityControlLabel"></div>
      </div>
      <button id="shuffleButton" class="secondary compact" hidden data-i18n="shufflePapers">Show Different Papers</button>
    </section>

    <nav id="classicsEraTabs" class="era-tabs" aria-label="Classics eras" data-i18n-aria-label="classicsEraTabsLabel" hidden></nav>
    <section id="modeIntro" class="mode-intro" hidden></section>
    <section id="status" class="status" data-i18n="loadingLatest">Loading latest papers...</section>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>

  <template id="paperTemplate">
    <article class="paper-card">
      <div class="avatar" aria-hidden="true">α</div>
      <div class="paper-content">
        <div class="paper-meta">
          <span class="primary-category"></span><span>·</span><span class="date"></span>
          <span class="classic-badge" hidden data-i18n="classicBadge">Highly cited</span><span class="citation-count" hidden></span>
        </div>
        <h2 class="title"></h2>
        <p class="authors"></p>
        <div class="discovery-badges" hidden></div>
        <p class="curator-note" hidden></p>
        <p class="summary collapsed"></p>
        <div class="reaction-actions" aria-label="Paper reactions" data-i18n-aria-label="paperReactionsLabel">
          <button class="interest reaction-button" type="button" data-i18n="reactionInterest">Interested</button>
          <button class="read reaction-button" type="button" data-i18n="reactionRead">Read</button>
          <button class="skip reaction-button" type="button" data-i18n="reactionSkip">Skip</button>
        </div>
        <div class="citation-guess" hidden>
          <div class="citation-guess-row">
            <span class="citation-guess-label"></span>
            <div class="citation-options"></div>
          </div>
          <div class="citation-result" hidden></div>
        </div>
        <div class="card-actions">
          <button class="readMore text-button" data-i18n="readMore">Read more</button>
          <button class="save text-button" data-i18n="save">Save</button>
          <button class="same-author text-button" type="button" data-i18n="sameAuthor">Same author</button>
          <button class="same-field text-button" type="button" data-i18n="sameField">Same field</button>
          <a class="abstract text-link" target="_blank" rel="noopener noreferrer">arXiv</a>
          <a class="pdf text-link" target="_blank" rel="noopener noreferrer">PDF</a>
        </div>
      </div>
    </article>
  </template>

  <script src="i18n.js"></script>
  <script src="presets.js"></script>
  <script src="feed.js"></script>
</body>
</html>
