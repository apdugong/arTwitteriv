<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>arTwitteriv 設定</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="options-wrap"><h1>arTwitteriv 設定</h1><form id="settingsForm" class="settings-form">
<section><h2>分野タブ</h2><p class="hint">表示名とarXiv検索式を自由に追加・編集・削除できます。</p><div id="fieldsContainer" class="fields-container"></div><div class="inline-actions"><button id="addField" type="button" class="secondary">分野を追加</button><button id="restoreFields" type="button" class="secondary">初期設定に戻す</button></div></section>
<label>起動時の分野<select id="defaultField"></select></label><label>著者名で絞り込み（空欄で指定なし）<input id="authorFilter" type="text" placeholder="例: Witten"></label><label>引用数ソース<select id="citationSourceMode"><option value="auto">自動（Semantic Scholar + INSPIRE）</option><option value="semantic">Semantic Scholarのみ</option><option value="inspire">INSPIREのみ</option></select></label><label>一度に表示する件数<input id="batchSize" type="number" min="5" max="50"></label>
<section><h2>ランダム</h2><div class="settings-grid"><label>開始日<input id="randomStartDate" type="date"></label><label>終了日（空欄で今日まで）<input id="randomEndDate" type="date"></label><label>最小引用数<input id="randomMinCitations" type="number" min="0"></label><label>最大引用数（空欄で上限なし）<input id="randomMaxCitations" type="number" min="0"></label></div></section>
<section><h2>名著</h2><p class="hint">固定リストは使わず、選択分野・期間・引用数を満たす論文を毎回取得します。</p><div class="settings-grid"><label>検索元<select id="classicsSearchSource"><option value="auto">自動（INSPIRE優先）</option><option value="inspire">INSPIREのみ</option><option value="arxiv">arXivベース</option></select></label><label>開始日<input id="classicsStartDate" type="date"></label><label>終了日（空欄で今日まで）<input id="classicsEndDate" type="date"></label><label>最小引用数<input id="classicsMinCitations" type="number" min="0"></label><label>最大引用数（空欄で上限なし）<input id="classicsMaxCitations" type="number" min="0"></label></div></section>
<div><button class="primary" type="submit">保存</button><span id="savedMessage" class="saved-message"></span></div></form></main>
<script src="presets.js"></script><script src="options.js"></script></body></html>
