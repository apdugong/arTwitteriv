<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>arTwitteriv Settings</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="options-wrap"><h1 data-i18n="optionsHeading">arTwitteriv Settings</h1><form id="settingsForm" class="settings-form">
<section><h2 data-i18n="fieldTabsHeading">Field Tabs</h2><p class="hint" data-i18n="fieldTabsHint">Add, edit, and remove display names and arXiv queries for the field tabs.</p><div id="fieldsContainer" class="fields-container"></div><div class="inline-actions"><button id="addField" type="button" class="secondary" data-i18n="addField">Add Field</button><button id="restoreFields" type="button" class="secondary" data-i18n="restoreFields">Restore Defaults</button><button id="undoRestoreFields" type="button" class="secondary" hidden data-i18n="undoRestoreFields">Undo Restore</button></div></section>
<label><span data-i18n="uiLanguage">Language</span><select id="uiLanguage"><option value="en" data-i18n="languageEnglish">English</option><option value="ja" data-i18n="languageJapanese">Japanese</option><option value="auto" data-i18n="languageAuto">Auto (Chrome language)</option></select></label><label><span data-i18n="defaultField">Default field</span><select id="defaultField"></select></label><label><span data-i18n="authorFilter">Filter by author name (blank for any author)</span><input id="authorFilter" type="text" placeholder="Example: Witten" data-i18n-placeholder="authorFilterPlaceholder"></label><label><span data-i18n="citationSource">Citation source</span><select id="citationSourceMode"><option value="auto" data-i18n="citationSourceAuto">Automatic (Semantic Scholar + INSPIRE)</option><option value="semantic" data-i18n="citationSourceSemantic">Semantic Scholar only</option><option value="inspire" data-i18n="citationSourceInspire">INSPIRE only</option></select></label><label><span data-i18n="batchSize">Papers per batch</span><input id="batchSize" type="number" min="5" max="50"></label>
<section><h2 data-i18n="randomHeading">Random</h2><div class="settings-grid"><label><span data-i18n="startDate">Start date</span><input id="randomStartDate" type="date"></label><label><span data-i18n="endDateOptional">End date (blank for today)</span><input id="randomEndDate" type="date"></label><label><span data-i18n="minCitations">Minimum citations</span><input id="randomMinCitations" type="number" min="0"></label><label><span data-i18n="maxCitationsOptional">Maximum citations (blank for no limit)</span><input id="randomMaxCitations" type="number" min="0"></label></div></section>
<section><h2 data-i18n="classicsHeading">Classics</h2><p class="hint" data-i18n="classicsHint">Instead of a fixed list, arTwitteriv fetches papers that match the selected field, dates, and citation range each time.</p><div class="settings-grid"><label><span data-i18n="searchSource">Search source</span><select id="classicsSearchSource"><option value="auto" data-i18n="classicsSourceAuto">Automatic (INSPIRE first)</option><option value="inspire" data-i18n="classicsSourceInspire">INSPIRE only</option><option value="arxiv" data-i18n="classicsSourceArxiv">arXiv based</option></select></label><label><span data-i18n="startDate">Start date</span><input id="classicsStartDate" type="date"></label><label><span data-i18n="endDateOptional">End date (blank for today)</span><input id="classicsEndDate" type="date"></label><label><span data-i18n="minCitations">Minimum citations</span><input id="classicsMinCitations" type="number" min="0"></label><label><span data-i18n="maxCitationsOptional">Maximum citations (blank for no limit)</span><input id="classicsMaxCitations" type="number" min="0"></label></div></section>
<div><button class="primary" type="submit" data-i18n="saveSettings">Save Settings</button><span id="savedMessage" class="saved-message"></span></div></form></main>
<script src="i18n.js"></script><script src="presets.js"></script><script src="options.js"></script></body></html>
